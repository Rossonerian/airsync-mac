name: Swift Build and Plus DMG

on:
  workflow_dispatch:
  push:
    branches: [ main, rossonerian-make-airsync-features-work ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: xcode-27

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27.0-beta'

    - name: Report Xcode version
      run: xcodebuild -version

    - name: Build Plus-enabled app
      run: |
        xcodebuild \
          -project AirSync.xcodeproj \
          -scheme "AirSync Self Compiled" \
          -configuration "Self Compiled" \
          -destination "platform=macOS" \
          -derivedDataPath "$RUNNER_TEMP/DerivedData" \
          CODE_SIGNING_ALLOWED=NO \
          build

    - name: Package and verify DMG
      run: |
        set -euo pipefail
        APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Self Compiled/AirSync.app"
        DMG_PATH="$RUNNER_TEMP/AirSync-Plus.dmg"
        test -d "$APP_PATH"
        hdiutil create -volname AirSync -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_PATH"
        hdiutil verify "$DMG_PATH"
        echo "DMG is unsigned and not notarized; no signing credentials were used."
    - name: Upload Plus-enabled DMG
      uses: actions/upload-artifact@v4
      with:
        name: AirSync-Plus-macOS
        path: ${{ runner.temp }}/AirSync-Plus.dmg
        if-no-files-found: error
        retention-days: 7
