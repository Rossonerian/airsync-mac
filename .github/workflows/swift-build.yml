name: Swift Build and Plus DMG

on:
  workflow_dispatch:
  push:
    branches: [ main, rossonerian-make-airsync-features-work ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: xcode-27

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Report Xcode version
      run: xcodebuild -version

    - name: Build Plus-enabled app
      run: |
        xcodebuild \
          -project AirSync.xcodeproj \
          -scheme "AirSync Self Compiled" \
          -configuration "Self Compiled" \
          -destination "platform=macOS" \
          -derivedDataPath "$RUNNER_TEMP/DerivedData" \
          CODE_SIGNING_ALLOWED=YES \
          CODE_SIGN_IDENTITY=- \
          build

    - name: Verify ad-hoc app signature
      run: |
        APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Self Compiled/AirSync.app"
        codesign --verify --deep --strict --verbose=2 "$APP_PATH"
        codesign -dv --verbose=2 "$APP_PATH" 2>&1

    - name: Package and verify DMG
      run: |
        set -euo pipefail
        APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Self Compiled/AirSync.app"
        DMG_PATH="$RUNNER_TEMP/AirSync-Plus.dmg"
        test -d "$APP_PATH"
        hdiutil create -volname AirSync -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_PATH"
        hdiutil verify "$DMG_PATH"
        echo "App is ad-hoc signed; DMG is unsigned and not notarized. No Developer ID credentials were used."
    - name: Upload Plus-enabled DMG
      uses: actions/upload-artifact@v4
      with:
        name: AirSync-Plus-macOS
        path: ${{ runner.temp }}/AirSync-Plus.dmg
        if-no-files-found: error
        retention-days: 7
